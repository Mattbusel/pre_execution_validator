name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the script
        shell: bash
        run: |
          python pre_execution_validator.py --version
          python pre_execution_validator.py | tee out.txt
          grep -q "Final Answer: False" out.txt
      - name: Install with pip and run the console script
        shell: bash
        run: |
          python -m pip install .
          pre_execution_validator --quiet | grep -q "Final Answer: False"
